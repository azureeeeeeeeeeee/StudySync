version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      # OPTIONAL: increases performance & stability
      - OLLAMA_KEEP_ALIVE=5m     
      - OLLAMA_NUM_PARALLEL=1    
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    runtime: nvidia  # For Linux + old Docker

volumes:
  ollama_data: